name: Freight Cost Model CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: freight-cost-model-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate -w freight-cost-api

      - name: Verify local artifact
        run: npm run verify:ci
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/freight_cost_ci
          SUPABASE_URL: https://alqjqzqagdmcywpjtnnr.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci-placeholder
          SUPABASE_EXPECTED_PROJECT_REF: alqjqzqagdmcywpjtnnr
          SUPABASE_JWT_AUDIENCE: authenticated
          NEXT_PUBLIC_SUPABASE_URL: https://alqjqzqagdmcywpjtnnr.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci-placeholder
          NEXT_PUBLIC_SITE_URL: http://localhost:3001
