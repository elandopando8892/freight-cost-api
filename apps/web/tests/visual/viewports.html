<!doctype html><html lang="es"><head><meta charset="UTF-8"><title>FCM QA — viewports medidos</title><style>body{margin:16px;font:14px Arial;background:#ddd}iframe{display:block;border:0;background:white;margin-top:12px}button{margin-right:12px;padding:8px}</style></head><body>
<h1>QA local · viewport de documento embebido</h1>
<p>Dimensiones CSS del iframe, no del navegador anfitrión. No incluye el shell autenticado.</p>
<button data-width="1440" data-height="900">1440 × 900</button><button data-width="1280" data-height="800">1280 × 800</button><button data-width="390" data-height="844">390 × 844</button>
<output id="size">1440 × 900</output><iframe title="FCM local" width="1440" height="900" src="/tests/visual/index.html"></iframe>
<script>const frame=document.querySelector('iframe');const page=new URLSearchParams(location.search).get('page');if(['segments','calibration','partners','partner-bases','benchmark'].includes(page))frame.src='/tests/visual/'+page+'.html';document.querySelectorAll('button').forEach(button=>button.addEventListener('click',()=>{frame.width=button.dataset.width;frame.height=button.dataset.height;document.querySelector('#size').textContent=frame.width+' × '+frame.height}))</script>
</body></html>
